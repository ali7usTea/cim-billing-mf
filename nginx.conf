worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
	# access_log /dev/stdout;
	# error_log /dev/stderr;

    # Enable gzip compression - Haider added these lines 24-April-2025
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_disable "msie6";
    
    server {
        listen 3000;
        server_name _;
        server_tokens off;
        root /usr/share/nginx/html;

        add_header X-Frame-Options "ALLOW-FROM https://cimnewuat.etisalat.corp.ae" always;

        # Default: HTML should not be cached by browsers (so users always get latest index.html)
        location ~* \\.(?:html?|json)$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            expires off;
            try_files $uri $uri/ /billing/index.html;
        }

        location = /billing {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
            return 301 https://next.cimnewuat.etisalat.corp.ae/billing/$is_args$args;
        }
        # Serve static assets (css/js/images/fonts) with long cache and immutable since filenames are content-hashed
        location ~* ^/billing/.*\.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot)$ {
            # One year caching for hashed assets
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Fallback for SPA routes - serve index.html and prevent caching of the HTML shell
        location /billing/ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            expires off;
            try_files $uri $uri.html $uri/ /billing/index.html;
        }

        # Serve SPA entry for any debugreport client route
        location ^~ /billing/debugreport {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
            try_files $uri $uri.html $uri/ /billing/index.html;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}
